name: Stussy New Arrivals Watcher

on:
  schedule:
    # 30분마다 실행 (UTC 기준, 필요하면 숫자만 바꾸세요. 예: */10 = 10분마다)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write  # 상태 파일(seen_products.json)을 저장소에 커밋하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 신상품 확인
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python check_new_arrivals.py

      - name: 상태 파일 저장(커밋)
        run: |
          git config user.name "stussy-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_products.json
          git diff --staged --quiet || git commit -m "update seen products"
          git push
